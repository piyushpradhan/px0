name: CI

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Bundle, build & test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      # web/app.js is not committed — regenerate it so go:embed has a fresh
      # bundle, and prove the source modules bundle cleanly.
      - name: Bundle web assets
        run: node ./scripts/build-web.js

      - name: Build px0
        run: go build -trimpath -o px0 .

      - name: Run tests
        run: go test -v ./...

      - name: Install SDK development dependencies
        run: npm ci --prefix sdk

      - name: SDK types, API contracts and editor parity
        working-directory: sdk
        env:
          PX0_BIN: ../px0
        run: npm run check

  sdk-package:
    name: SDK package (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
        working-directory: sdk
      - name: Verify installed tarball and declarations
        run: npm run test:package
        working-directory: sdk
